[package]
name = "revolumetric"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1.24", features = ["derive"] }
crossbeam = "0.8"
glam = { version = "0.30", features = ["bytemuck", "serde"] }
gpu-allocator = { version = "0.28", features = ["vulkan"] }
hecs = "0.11"
parking_lot = "0.12"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
egui = { version = "0.30.0", features = ["bytemuck"] }
egui-winit = { version = "0.30.0", features = ["bytemuck"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Feature used to gate the desktop/native binary so Android builds only the library
desktop = []
nrd = []
default = []

[[bin]]
name = "revolumetric"
path = "src/main.rs"
# only build the binary when the `desktop` feature is enabled
required-features = ["desktop"]

[package.metadata.android]
apk_name = "Revolumetric"
assets = "assets"
build_targets = ["aarch64-linux-android"]
min_sdk_version = 26
target_sdk_version = 33

[package.metadata.android.signing.release]
path = "android-release.pfx"
keystore_password = "Revolumetric_Release_2026"

[build-dependencies]
cc = "1"
walkdir = "2"

[profile.release]
panic = "unwind"
